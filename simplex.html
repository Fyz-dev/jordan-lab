<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JordanLab - Simplex Solver</title>
  </head>
  <body>
    <div id="app">
      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-title">JordanLab</div>
          <nav class="sidebar-nav" aria-label="Навігація по сторінках">
            <a href="/index.html" class="nav-link">Жордановi виключення</a>
            <a href="/simplex.html" class="nav-link active" aria-current="page">
              Simplex solver
            </a>
          </nav>
        </aside>

        <div class="container">
          <header>
            <h1>Simplex Solver</h1>
            <p>Метод МЖВ для задач лінійного програмування</p>
          </header>

          <main>
            <section class="input-section simplex-form-section">
              <div class="simplex-grid">
                <div class="size-input">
                  <label for="simplexType">Тип задачі:</label>
                  <select id="simplexType" class="mode-select">
                    <option value="max">Максимізація</option>
                    <option value="min">Мінімізація</option>
                  </select>
                </div>

                <div class="size-input">
                  <label for="simplexVarsCount">Кількість змінних:</label>
                  <input
                    type="number"
                    id="simplexVarsCount"
                    min="1"
                    max="10"
                    value="2"
                    class="size-input-field"
                  />
                </div>
              </div>

              <div class="size-input">
                <label for="simplexObjective">Цільова функція:</label>
                <input
                  type="text"
                  id="simplexObjective"
                  class="size-input-field"
                  value="3x1 + 5x2"
                  placeholder="Наприклад: 3x1 + 5x2"
                />
              </div>

              <div class="size-input">
                <label for="simplexConstraints"
                  >Обмеження (кожне з нового рядка):</label
                >
                <textarea
                  id="simplexConstraints"
                  class="simplex-constraints"
                  placeholder="2x1 + 3x2 <= 8&#10;x1 + x2 <= 4"
                >
2x1 + 3x2 <= 8
x1 + x2 <= 4</textarea
                >
              </div>

              <div class="button-group">
                <button id="simplexSolveBtn" class="btn btn-success">
                  Розв'язати
                </button>
                <button id="simplexClearBtn" class="btn btn-secondary">
                  Очистити
                </button>
              </div>
            </section>

            <section class="output-section">
              <label for="simplexResult">Результат:</label>
              <textarea
                id="simplexResult"
                class="log-output"
                readonly
                placeholder="Результати simplex solver будуть виведені сюди..."
              ></textarea>
            </section>
          </main>
        </div>
      </div>
    </div>

    <script type="module" src="/src/simplex-main.ts"></script>
  </body>
</html>
