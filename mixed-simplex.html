<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JordanLab</title>
  </head>
  <body>
    <div id="app">
      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-title">JordanLab</div>
          <nav class="sidebar-nav" aria-label="Навігація по сторінках">
            <a href="/index.html" class="nav-link"
              >Ранг, обернена матриця, обчислення СЛАУ</a
            >
            <a href="/simplex.html" class="nav-link">Розв'язання ЗЛП (МЖВ)</a>
            <a
              href="/mixed-simplex.html"
              class="nav-link active"
              aria-current="page"
            >
              Змішані обмеження ЗЛП
            </a>
          </nav>
        </aside>

        <div class="container">
          <header>
            <h1>Змішані обмеження ЗЛП</h1>
            <p>Метод модифікованих жорданових виключень</p>
          </header>

          <main>
            <section class="input-section simplex-form-section">
              <div class="simplex-grid">
                <div class="size-input">
                  <label for="mixedSimplexType">Тип задачі:</label>
                  <select id="mixedSimplexType" class="mode-select">
                    <option value="max">Максимізація</option>
                    <option value="min">Мінімізація</option>
                  </select>
                </div>

                <div class="size-input">
                  <label for="mixedSimplexVarsCount">Кількість змінних:</label>
                  <input
                    type="number"
                    id="mixedSimplexVarsCount"
                    min="1"
                    max="10"
                    value="4"
                    class="size-input-field"
                  />
                </div>
              </div>

              <div class="size-input">
                <label for="mixedSimplexObjective">Цільова функція:</label>
                <input
                  type="text"
                  id="mixedSimplexObjective"
                  class="size-input-field"
                  value="10x1 - x2 - 42x3 - 52x4"
                  placeholder="Наприклад: 10x1 - x2 - 42x3 - 52x4"
                />
              </div>

              <div class="size-input">
                <label for="mixedSimplexConstraints"
                  >Обмеження (кожне з нового рядка):</label
                >
                <textarea
                  id="mixedSimplexConstraints"
                  class="simplex-constraints"
                  placeholder="-2x1 + x2 + x3 + 3x4 = 2&#10;-3x1 + 2x2 - 3x3 = 7"
                >
-2x1 + x2 + x3 + 3x4 = 2
-3x1 + 2x2 - 3x3 = 7
-3x1 + x2 + 4x3 + x4 <= 1
3x1 - 2x2 + 2x3 - 2x4 <= -9</textarea
                >
              </div>

              <div class="button-group">
                <button id="mixedSimplexSolveBtn" class="btn btn-success">
                  Розв'язати
                </button>
                <button id="mixedSimplexClearBtn" class="btn btn-secondary">
                  Очистити
                </button>
              </div>
            </section>

            <section class="output-section">
              <label for="mixedSimplexResult"
                >Згенерований протокол обчислення:</label
              >
              <textarea
                id="mixedSimplexResult"
                class="log-output"
                readonly
                placeholder="Результати будуть виведені сюди..."
              ></textarea>
            </section>
          </main>
        </div>
      </div>
    </div>

    <script type="module" src="/src/mixed-simplex.ts"></script>
  </body>
</html>
