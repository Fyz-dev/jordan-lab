<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JordanLab</title>
  </head>
  <body>
    <div id="app">
      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-title">JordanLab</div>
          <nav class="sidebar-nav" aria-label="Навігація по сторінках">
            <a href="/index.html" class="nav-link">
              Ранг, обернена матриця, обчислення СЛАУ
            </a>
            <a href="/simplex.html" class="nav-link">Розв'язання ЗЛП (МЖВ)</a>
            <a
              href="/mixed-simplex.html"
              class="nav-link active"
              aria-current="page"
            >
              Змішані обмеження в ЗЛП
            </a>
          </nav>
        </aside>

        <div class="container">
          <header>
            <h1>Змішані обмеження в ЗЛП</h1>
            <p>
              Метод модифікованих жорданових виключень для задач з вільними
              змінними
            </p>
          </header>

          <main>
            <section class="input-section simplex-form-section">
              <div class="simplex-grid">
                <div class="size-input">
                  <label for="advancedSimplexType">Тип задачі:</label>
                  <select id="advancedSimplexType" class="mode-select">
                    <option value="max">Максимізація</option>
                    <option value="min">Мінімізація</option>
                  </select>
                </div>

                <div class="size-input">
                  <label for="advancedSimplexVarsCount"
                    >Кількість змінних:</label
                  >
                  <input
                    type="number"
                    id="advancedSimplexVarsCount"
                    min="1"
                    max="10"
                    value="3"
                    class="size-input-field"
                  />
                </div>
              </div>

              <div class="size-input">
                <label for="advancedSimplexFreeVars">Вільні змінні:</label>
                <input
                  type="text"
                  id="advancedSimplexFreeVars"
                  class="size-input-field"
                  value="x1, x2"
                  placeholder="Наприклад: x1, x2 або 1, 2"
                />
              </div>

              <div class="size-input">
                <label for="advancedSimplexObjective">Цільова функція:</label>
                <input
                  type="text"
                  id="advancedSimplexObjective"
                  class="size-input-field"
                  value="3x1 - 2x2 + 4x3"
                  placeholder="Наприклад: 3x1 - 2x2 + 4x3"
                />
              </div>

              <div class="size-input">
                <label for="advancedSimplexConstraints">
                  Обмеження (кожне з нового рядка):
                </label>
                <textarea
                  id="advancedSimplexConstraints"
                  class="simplex-constraints"
                  placeholder="x1 + x2 = 4&#10;2x1 - x3 <= 6"
                >
x1 + x2 = 4
2x1 - x3 <= 6
x2 + x3 >= 1</textarea
                >
              </div>

              <div class="button-group">
                <button id="advancedSimplexSolveBtn" class="btn btn-success">
                  Розв'язати
                </button>
                <button id="advancedSimplexClearBtn" class="btn btn-secondary">
                  Очистити
                </button>
              </div>
            </section>

            <section class="output-section">
              <label for="advancedSimplexResult">Результат:</label>
              <textarea
                id="advancedSimplexResult"
                class="log-output"
                readonly
                placeholder="Результати будуть виведені сюди..."
              ></textarea>
            </section>
          </main>
        </div>
      </div>
    </div>

    <script type="module" src="/src/advanced-simplex.ts"></script>
  </body>
</html>
