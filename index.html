<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JordanLab</title>
  </head>
  <body>
    <div id="app">
      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-title">JordanLab</div>
          <nav class="sidebar-nav" aria-label="Навігація по сторінках">
            <a href="/index.html" class="nav-link active" aria-current="page">
              Ранг, обернена матриця, обчислення СЛАУ
            </a>
            <a href="/simplex.html" class="nav-link">Розв'язання ЗЛП (МЖВ)</a>
          </nav>
        </aside>

        <div class="container">
          <header>
            <h1>Ранг, обернена матриця, обчислення СЛАУ</h1>
            <p>Метод Звичайних Жорданових Виключень</p>
          </header>

          <main>
            <section class="input-section">
              <div class="controls">
                <div class="mode-selector">
                  <label for="mode">Операція:</label>
                  <select id="mode" class="mode-select">
                    <option value="inverse">Обернена матриця</option>
                    <option value="rank">Ранг матриці</option>
                    <option value="solve">Розв'язання СЛАР (метод 1)</option>
                  </select>
                </div>

                <div class="matrix-size">
                  <div class="size-input">
                    <label for="rows">Рядків (n):</label>
                    <input
                      type="number"
                      id="rows"
                      min="1"
                      max="10"
                      value="3"
                      class="size-input-field"
                    />
                  </div>
                  <div class="size-input">
                    <label for="cols">Стовпців (m):</label>
                    <input
                      type="number"
                      id="cols"
                      min="1"
                      max="10"
                      value="3"
                      class="size-input-field"
                    />
                  </div>
                  <button id="generateBtn" class="btn btn-primary">
                    Сгенерувати матрицю
                  </button>
                </div>
              </div>

              <div class="matrix-workspace">
                <div class="matrix-input">
                  <label>Матриця A:</label>
                  <div id="matrixContainer" class="matrix-inputs"></div>
                </div>

                <div
                  id="vectorSection"
                  class="vector-input"
                  style="display: none"
                >
                  <label>Вектор B:</label>
                  <div id="vectorContainer" class="vector-inputs"></div>
                </div>
              </div>

              <div class="button-group">
                <button id="calculateBtn" class="btn btn-success">
                  Обчислити
                </button>
                <button id="clearBtn" class="btn btn-secondary">
                  Очистити
                </button>
              </div>
            </section>

            <section class="output-section">
              <label for="logOutput">Згенерований протокол обчислення:</label>
              <textarea
                id="logOutput"
                class="log-output"
                readonly
                placeholder="Результати будуть виведені сюди..."
              ></textarea>
            </section>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
